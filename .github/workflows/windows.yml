name: Windows engine contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        shell: pwsh
        run: ./scripts/setup-deps.ps1
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B ../GMEngineBuild/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/../GMEngineApp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build ../GMEngineBuild/build --config Release --parallel 4
      - name: Headless contracts
        shell: pwsh
        run: ctest --test-dir ../GMEngineBuild/build -C Release --output-on-failure -E renderer_contract
      - name: Install and verify independent projects
        shell: pwsh
        run: |
          cmake --install ../GMEngineBuild/build --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-v08.ps1
          ./scripts/test-project.ps1
